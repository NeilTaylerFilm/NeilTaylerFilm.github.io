# ==========================================
# 🚀 AUTOMATIC GITHUB PAGES DEPLOYMENT (.github/workflows/deploy.yml)
# ==========================================
# This workflow is your automated construction robot living in GitHub's cloud!
# Whenever you push new writing, photos, or code to the "main" branch:
# 1. It spins up a fresh virtual computer in GitHub's datacenter.
# 2. Runs the exact same safety tests (npm test & verify) that you run locally.
# 3. Builds the production HTML files in the "dist" folder.
# 4. Deploys them directly to GitHub Pages (https://neiltaylerfilm.com) with zero downtime!

name: Deploy Astro to GitHub Pages

# 🔔 TRIGGER: Runs automatically whenever you push changes to the main branch
on:
  push:
    branches: [main]
  # Also lets you manually click "Run workflow" in GitHub
  workflow_dispatch:

# 🛡️ PERMISSIONS: Only grant read access to code for safety
permissions:
  contents: read

# 🚦 CONCURRENCY: If you push twice quickly, cancels the older build so they don't collide
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 📥 Step 1: Download your codebase onto the cloud machine
      - uses: actions/checkout@v4
      # 🟢 Step 2: Install Node.js v24 with npm package caching
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 📦 Step 3: Install exact project dependencies
      - run: npm ci
      # 🔍 Step 4: Run Astro TypeScript typechecker
      - run: npm run check
      # 🧪 Step 5: Run automated test suite
      - run: npm test
      # 🏗️ Step 6: Build the static production website into dist/
      - run: npm run build
      # 🕵️ Step 7: Verify all HTML links and image manifests
      - run: npm run verify
      # 📤 Step 8: Package the dist folder for deployment
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
