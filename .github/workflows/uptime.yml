# ==========================================
# ⏱️ 24/7 WEBSITE UPTIME GUARDIAN (.github/workflows/uptime.yml)
# ==========================================
# Think of this script as an automated security guard doing rounds every 6 hours!
# It wakes up on schedule in the cloud and quietly tests:
# 1. Is your homepage online and responding fast?
# 2. Is your photography exhibition page online?
# 3. Is your Cloudflare R2 photo server delivering images correctly?
# If anything ever goes offline, GitHub immediately emails you an alert!

name: Check public site

# ⏰ SCHEDULE: Runs automatically every 6 hours (at minute 19 past the hour)
on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch: # Also lets you manually click "Run workflow" to test anytime

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # 🔍 PING CHECK: Sends web requests to verify pages and photos are healthy
      - name: Check website pages and photo delivery
        shell: bash
        run: |
          set -euo pipefail
          # 🌐 Step 1: Ping the homepage and photography gallery
          for url in \
            'https://neiltaylerfilm.github.io/' \
            'https://neiltaylerfilm.github.io/photography/'; do
            echo "Checking $url"
            curl --fail --location --silent --show-error \
              --retry 2 --retry-all-errors --retry-delay 3 --max-time 20 \
              --output /dev/null "$url"
          done

          # Keep this URL in sync if the first featured photo is removed from R2.
          # 📸 Step 2: Ping our Cloudflare R2 worker to verify live photo streaming
          photo='https://neiltaylerfilm-images.neiltayler2003.workers.dev/photos/588176e9b85445d319829378ab9beff3-1707.jpeg'
          headers="$(curl --head --fail --location --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 3 --max-time 20 "$photo")"
          if ! grep -Eiq '^content-type:[[:space:]]*image/' <<< "$headers"; then
            echo 'Photo endpoint responded, but did not identify the response as an image.' >&2
            exit 1
          fi
